name: Change-scoped quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      syntax: ${{ steps.scope.outputs.syntax }}
      syntax_files: ${{ steps.scope.outputs.syntax_files }}
      inline_syntax: ${{ steps.scope.outputs.inline_syntax }}
      resource_version: ${{ steps.scope.outputs.resource_version }}
      regression: ${{ steps.scope.outputs.regression }}
      browser: ${{ steps.scope.outputs.browser }}
      browser_files: ${{ steps.scope.outputs.browser_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+$'; then
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          node scripts/quality-scope.cjs --base "$BASE" --head "$HEAD"

  syntax:
    needs: scope
    if: needs.scope.outputs.syntax == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript only
        env:
          FILES: ${{ needs.scope.outputs.syntax_files }}
        shell: bash
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "node --check $file"
            node --check "$file"
          done <<< "$FILES"
      - name: Check inline JavaScript
        if: needs.scope.outputs.inline_syntax == 'true'
        run: node scripts/check-inline.cjs

  resource-version:
    needs: scope
    if: needs.scope.outputs.resource_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify first-party resource revision
        run: node scripts/resource-version.cjs --check

  regression:
    needs: scope
    if: needs.scope.outputs.regression == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data and aggregation regression
        run: node scripts/verify-contour.cjs
      - name: Date, source and quality routing contracts
        run: node --test tests/unit/*.test.cjs

  browser:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tooling
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run only browser tests relevant to this diff
        env:
          BROWSER_FILES: ${{ needs.scope.outputs.browser_files }}
        shell: bash
        run: |
          mapfile -t files <<< "$BROWSER_FILES"
          printf 'Selected browser tests: %s\n' "${files[*]}"
          npx playwright test "${files[@]}"
